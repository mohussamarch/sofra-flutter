<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sofra kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #view { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 320ms cubic-bezier(.65, 0, .35, 1); }
  canvas.ready { opacity: 1; }
  #hud { position: fixed; left: 8px; bottom: 8px; direction: ltr; font: 11px/1.5 ui-monospace, monospace; color: #fff; background: #000a; padding: 4px 8px; border-radius: 8px; white-space: pre; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="hud"></div>
<script>
  // Commands that arrive before the viewer module is up wait here.
  window.__sofraQueue = [];
  window.sofraKitchen = function (m) { window.__sofraQueue.push(m); };
  window.addEventListener('message', function (e) {
    // Only the app that embeds this page may drive it.
    if (e.source === parent && e.data && e.data.sofraKitchenCmd) window.sofraKitchen(e.data.sofraKitchenCmd);
  });
  // The viewer script (or one of its imports) did not load at all.
  window.sofraFailed = function () {
    var text = JSON.stringify({ t: 'error', message: 'viewer script did not load' });
    if (window.SofraKitchen) window.SofraKitchen.postMessage(text);
    else if (parent !== window) parent.postMessage({ sofraKitchen: new URLSearchParams(location.search).get('id') || '', data: text }, '*');
  };
</script>
<script type="module" src="./kitchen.js" onerror="sofraFailed()"></script>
</body>
</html>
