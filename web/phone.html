<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سفرة · iPhone</title>
  <!-- Dev preview only: the app inside an iPhone 16 Pro screen (402×874 pt),
       with the status bar and home indicator kept out of the app's area,
       so layouts are judged at a real phone's proportions. -->
  <style>
    :root { --w: 402px; --h: 874px; --top: 54px; --bottom: 22px; }
    html, body { margin: 0; height: 100%; background: #e9e5df; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", sans-serif;
    }
    .fit { transform-origin: center; }
    .phone {
      position: relative; width: var(--w); height: var(--h);
      border-radius: 62px; padding: 12px; background: #1b1b1d;
      box-shadow: 0 0 0 2px #3a3a3e, 0 30px 80px rgba(0,0,0,.35);
    }
    .screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 52px; overflow: hidden; background: #110d0a;
    }
    .status {
      position: absolute; inset: 0 0 auto; height: var(--top);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 34px; color: #fff; font-weight: 600; font-size: 16px;
      direction: ltr; z-index: 2; pointer-events: none;
    }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 3;
    }
    iframe {
      position: absolute; top: var(--top); left: 0; border: 0;
      width: 100%; height: calc(100% - var(--top) - var(--bottom));
    }
    .home {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 140px; height: 5px; border-radius: 3px; background: #fff; opacity: .8;
    }
  </style>
</head>
<body>
  <div class="fit" id="fit">
    <div class="phone">
      <div class="screen">
        <div class="status"><span id="clock">9:41</span><span>●●● ▮</span></div>
        <div class="island"></div>
        <iframe src="index.html" title="سفرة"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>
  <script>
    // Scale the whole phone down when the window is shorter than it.
    const fit = () => {
      const s = Math.min(1, (innerHeight - 24) / 898, (innerWidth - 24) / 426);
      document.getElementById('fit').style.transform = `scale(${s})`;
    };
    addEventListener('resize', fit); fit();
    const t = new Date();
    document.getElementById('clock').textContent =
      t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
  </script>
</body>
</html>
