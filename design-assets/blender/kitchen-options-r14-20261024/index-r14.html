<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>سُفرة — مراجعة المطبخ r14</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5eee1;color:#34382d;font:17px system-ui}header{max-width:1500px;margin:auto}h1{font-size:27px;margin:0 0 8px}p{margin:6px 0 14px;color:#665f50}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;border:1px solid #b9b29e;border-radius:12px;background:#fffaf0;padding:9px 18px;cursor:pointer}button.active{background:#325b4d;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1500px;margin:auto}.card{background:#fffaf2;border:1px solid #d9cdb6;border-radius:18px;overflow:hidden}.card h2{font-size:18px;margin:12px 16px}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#464b51}.note{font-size:14px;padding:0 16px 12px;color:#73684f}a{color:inherit}@media(max-width:700px){body{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:23px}}body.qa .grid{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1600px}body.qa header{max-width:1600px}</style><header><h1>سُفرة — اختيار الإضافات والإضاءة</h1><p>رندرات Blender للمراجعة فقط. الأساسي هو منظر فتح التطبيق. لم تُعتمد الاختيارات أو تُدمج في التطبيق بعد.</p><nav id="modes"></nav><nav id="families"></nav><p id="caption"></p></header><main class="grid" id="grid"></main><script>
const variants=[['base','الأساس','appliances'],['microwave','ميكروويف الركن','appliances'],['double_fridge','تلاجة معدن بابين','appliances'],['palette_coral','باستيل مرجاني','colors'],['palette_blue','باستيل أزرق','colors'],['hanging_plants','زرع متدلّي','soft'],['curtain_blue','كاروهات أزرق — الدافئ في الأساس','soft'],['white_blind','ستارة مكتبية بيضاء','soft'],['no_curtain','بدون ستارة','soft'],['rug_persian','سجادة فارسية داكنة','soft'],['rug_teal','سجادة معينات تركواز','soft'],['rug_ochre','سجادة زهور خردلي','soft'],['builtin','بوتاجاز مسطح وفرن بلت إن','appliances'],['table_chairs','ترابيزة مربعة و3 كراسي','appliances']];
const params=new URLSearchParams(location.search);let mode=params.get('mode')||'morning',family=params.get('family')||'all';if(params.has('qa'))document.body.classList.add('qa');
const modeNames={morning:'الصبح',night:'الليل',golden:'الغروب الذهبي'},familyNames={all:'كل الاختيارات',appliances:'الأساس والأجهزة والأثاث',colors:'ألوان الدواليب',soft:'الستائر والسجاد والزرع'};
function draw(){document.querySelector('#modes').innerHTML=Object.entries(modeNames).map(([id,n])=>`<button data-mode="${id}" class="${id===mode?'active':''}">${n}</button>`).join('');document.querySelector('#families').innerHTML=Object.entries(familyNames).map(([id,n])=>`<button data-family="${id}" class="${id===family?'active':''}">${n}</button>`).join('');document.querySelector('#caption').textContent=`${modeNames[mode]} — ${familyNames[family]} · اضغط الصورة لفتح الرندر بالحجم الكامل.`;document.querySelector('#grid').innerHTML=variants.filter(v=>family==='all'||v[2]===family).map(([id,n])=>`<article class="card"><h2>${n}</h2><a href="renders/${id}--${mode}.png?r=14b" target="_blank"><img alt="${n} ${modeNames[mode]}" src="renders/${id}--${mode}.png?r=14b"></a><div class="note">${id==='base'?'المنظر الأساسي، وليس اختيار إضافة':'إضافة مستقلة؛ دمج الاختيارات مع بعضها لم يُختبر بعد'}</div></article>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{family=b.dataset.family;draw()});}draw();
</script></html>
