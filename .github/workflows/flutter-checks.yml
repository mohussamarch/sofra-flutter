name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test
      - run: flutter build web

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --debug
      - name: Start an iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[v["udid"] for devices in d.values() for v in devices if v["name"].startswith("iPhone") and v["state"]=="Shutdown"]; print(ids[0] if ids else "")')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run the full demo flow on iOS
        timeout-minutes: 11
        run: python3 tool/run_ios_flow.py "$SIMULATOR_ID"
      - name: Capture simulator state
        if: always()
        timeout-minutes: 2
        run: xcrun simctl io "$SIMULATOR_ID" screenshot ios-simulator.png
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-screenshots
          path: ios-*.png
